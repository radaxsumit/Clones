<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo">
                <div class="logo"></div>
            </div>

            <div class="nav-address">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-sec">India +91 </p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option value="all">All</option>
                    <option value="books">Book</option>
                    <!-- <option value="electronics">Elect</option> -->

                </select>
                <input type="text" placeholder="Search Amazon.in" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="lang"> 
                <i class="fa-regular fa-flag"></i>
                <select name="language" id="language">
                    <option value="en">EN</option>
                    <option value="hi">HI</option>
                </select> 
            </div>

            <div class="nav-sign">
                <span class="sign-first">Hello, Sign in</span>
                <span class="sign-sec">Account & Lists</span>
            </div>
            <div class="nav-return">
                <span class="re-first">Returns</span>
                <span class="re-sec">& Orders</span>
            </div>

            <div class="nav-cart">
                    <div class="cart-icon"> <i class="fa-solid fa-cart-shopping"> </i></div>
                    <span class="cart-text">Cart</span>
            </div>
        </div>

        <div class="pannel">
            <div class="pannel-icon"> <i class="fa-solid fa-bars"></i> 
                <span class="pannel-first">
                    All
                </span>
            </div>
            
            <div class="pannel-ops">
                <span>Today's Deals</span>
                <span>Customer Service</span>
                <span>Groceries & Food</span>
                <span>Gift Cards</span>
                <span>Registry</span>
                <span>Sell</span>
                <span>AmazonBasics</span> 
                <span>Again</span> 
                <span>Amazon Pay</span> 
                <span>Gift Ideas</span> 
            </div>

            <div class="pannel-other">
                <p>Great Indian Festival | Top deals revealed</p>
            </div>
        </div>
    </header>
</body>
</html>
